<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc"><title id="title">Kage research architecture — coupled execution and evolution loops</title><desc id="desc">Execution cycles through observe, execute, verify and context updates. Verified evidence enters memory, candidate generation, evaluation and capability transfer. Dashed connections carry evidence and capability feedback.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#76e3d0"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#304350" stroke-opacity=".3"/></pattern></defs><rect width="1400" height="690" rx="20" fill="#0c141c"/><rect width="1400" height="690" rx="20" fill="url(#grid)"/><text x="60" y="61" font-family="monospace" font-size="16" font-weight="600" fill="#76e3d0" >01 / SYSTEM ARCHITECTURE</text><text x="60" y="107" font-family="Georgia, serif" font-size="40" font-weight="500" fill="#e8f1f4" >Two loops. One growing agent.</text><text x="60" y="142" font-family="sans-serif" font-size="19" font-weight="400" fill="#99b0bc" >Execute in the environment. Adapt the machinery of execution.</text><rect x="48" y="182" width="626" height="380" rx="12" fill="#0c141c" stroke="#304350"/><rect x="698" y="182" width="654" height="380" rx="12" fill="#0c141c" stroke="#304350"/><text x="74" y="221" font-family="monospace" font-size="16" font-weight="600" fill="#76e3d0" >EXECUTION LOOP</text><text x="724" y="221" font-family="monospace" font-size="16" font-weight="600" fill="#ffc887" >EVOLUTION LOOP</text><rect x="76" y="250" width="235" height="78" rx="12" fill="#14212c" stroke="#304350"/><text x="96" y="282" font-family="sans-serif" font-size="23" font-weight="600" fill="#e8f1f4" >Observe &amp; decide</text><text x="96" y="309" font-family="sans-serif" font-size="16" font-weight="400" fill="#99b0bc" >Local model / cloud model</text><rect x="396" y="250" width="248" height="78" rx="12" fill="#14212c" stroke="#304350"/><text x="416" y="282" font-family="sans-serif" font-size="23" font-weight="600" fill="#e8f1f4" >Execute</text><text x="416" y="309" font-family="sans-serif" font-size="16" font-weight="400" fill="#99b0bc" >DOM / files / desktop tools</text><rect x="396" y="411" width="248" height="78" rx="12" fill="#14212c" stroke="#304350"/><text x="416" y="443" font-family="sans-serif" font-size="23" font-weight="600" fill="#e8f1f4" >Verify</text><text x="416" y="470" font-family="sans-serif" font-size="16" font-weight="400" fill="#99b0bc" >Saved state / task checks</text><rect x="76" y="411" width="235" height="78" rx="12" fill="#14212c" stroke="#304350"/><text x="96" y="443" font-family="sans-serif" font-size="23" font-weight="600" fill="#e8f1f4" >Update context</text><text x="96" y="470" font-family="sans-serif" font-size="16" font-weight="400" fill="#99b0bc" >Fresh state / tool feedback</text><path d="M311 289 H396" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M520 328 V411" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M396 450 H311" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M194 411 V328" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><rect x="727" y="250" width="253" height="78" rx="12" fill="#14212c" stroke="#304350"/><text x="747" y="282" font-family="sans-serif" font-size="23" font-weight="600" fill="#e8f1f4" >Remember</text><text x="747" y="309" font-family="sans-serif" font-size="16" font-weight="400" fill="#99b0bc" >Episodes / evidence / lineage</text><rect x="1066" y="250" width="256" height="78" rx="12" fill="#14212c" stroke="#304350"/><text x="1086" y="282" font-family="sans-serif" font-size="23" font-weight="600" fill="#e8f1f4" >Propose changes</text><text x="1086" y="309" font-family="sans-serif" font-size="16" font-weight="400" fill="#99b0bc" >Skills / selected agent code</text><rect x="1066" y="411" width="256" height="78" rx="12" fill="#14212c" stroke="#304350"/><text x="1086" y="443" font-family="sans-serif" font-size="23" font-weight="600" fill="#e8f1f4" >Evaluate &amp; select</text><text x="1086" y="470" font-family="sans-serif" font-size="16" font-weight="400" fill="#99b0bc" >Candidate comparison</text><rect x="727" y="411" width="253" height="78" rx="12" fill="#14212c" stroke="#304350"/><text x="747" y="443" font-family="sans-serif" font-size="23" font-weight="600" fill="#e8f1f4" >Transfer capability</text><text x="747" y="470" font-family="sans-serif" font-size="16" font-weight="400" fill="#99b0bc" >Reusable skills / versions</text><path d="M980 289 H1066" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M1194 328 V411" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M1066 450 H980" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M854 411 V328" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M644 450 H681 V289 H727" fill="none" stroke="#76e3d0" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/><path d="M727 489 V600 H194 V489" fill="none" stroke="#76e3d0" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="437" y="586" font-family="monospace" font-size="14" font-weight="500" fill="#76e3d0" >CAPABILITY FEEDBACK</text><text x="60" y="648" font-family="sans-serif" font-size="16" font-weight="400" fill="#99b0bc" >Research architecture · Module coverage and validation are tracked separately in the experiment reports.</text></svg>