<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="770" viewBox="0 0 1400 770" role="img" aria-labelledby="title desc"><title id="title">Coupled execution and evolution research loops</title><desc id="desc">Two circular loops express the execution timescale and adaptation timescale. Execution observes, acts, verifies and re-observes. Evolution remembers, proposes, compares and reuses. Dashed arrows carry verified experience and capability feedback. This is a research architecture.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#519cc9"/></marker></defs><rect width="1400" height="770" fill="#f7fafc"/><text x="60" y="55" fill="#519cc9" font-family="monospace" font-size="15" font-weight="500" text-anchor="start">01  /  RESEARCH ARCHITECTURE</text><text x="60" y="117" fill="#3c4254" font-family="Georgia, serif" font-size="49" font-weight="400" text-anchor="start">One companion. Two growth loops.</text><text x="60" y="157" fill="#7b8393" font-family="sans-serif" font-size="23" font-weight="400" text-anchor="start">Execution changes the environment. Evolution changes the agent.</text><path d="M60 194 L1340 194" fill="none" stroke="#d4e2ec"/><path d="M700 231 L700 589" fill="none" stroke="#d4e2ec"/><text x="360" y="242" fill="#519cc9" font-family="monospace" font-size="17" font-weight="600" text-anchor="middle">ACT</text><text x="1040" y="242" fill="#519cc9" font-family="monospace" font-size="17" font-weight="600" text-anchor="middle">ADAPT</text><circle cx="360" cy="413" r="115" fill="none" stroke="#d4e2ec" stroke-width="1.5"/><text x="360" y="419" fill="#3c4254" font-family="Georgia, serif" font-size="32" font-weight="500" text-anchor="middle">KAGE</text><circle cx="1040" cy="413" r="115" fill="none" stroke="#d4e2ec" stroke-width="1.5"/><text x="1040" y="419" fill="#3c4254" font-family="Georgia, serif" font-size="32" font-weight="500" text-anchor="middle">KAGE</text><text x="360" y="265" fill="#519cc9" font-family="monospace" font-size="12" font-weight="500" text-anchor="middle">01</text><text x="360" y="294" fill="#3c4254" font-family="sans-serif" font-size="22" font-weight="600" text-anchor="middle">Observe &amp; decide</text><text x="360" y="321" fill="#7b8393" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle">Local / cloud inference</text><text x="586" y="392" fill="#519cc9" font-family="monospace" font-size="12" font-weight="500" text-anchor="middle">02</text><text x="586" y="421" fill="#3c4254" font-family="sans-serif" font-size="22" font-weight="600" text-anchor="middle">Execute</text><text x="586" y="448" fill="#7b8393" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle">Tools + environment</text><text x="360" y="538" fill="#519cc9" font-family="monospace" font-size="12" font-weight="500" text-anchor="middle">03</text><text x="360" y="567" fill="#3c4254" font-family="sans-serif" font-size="22" font-weight="600" text-anchor="middle">Verify</text><text x="360" y="594" fill="#7b8393" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle">Actual task outcome</text><text x="134" y="392" fill="#519cc9" font-family="monospace" font-size="12" font-weight="500" text-anchor="middle">04</text><text x="134" y="421" fill="#3c4254" font-family="sans-serif" font-size="22" font-weight="600" text-anchor="middle">Re-observe</text><text x="134" y="448" fill="#7b8393" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle">Fresh execution state</text><text x="1040" y="265" fill="#519cc9" font-family="monospace" font-size="12" font-weight="500" text-anchor="middle">01</text><text x="1040" y="294" fill="#3c4254" font-family="sans-serif" font-size="22" font-weight="600" text-anchor="middle">Remember</text><text x="1040" y="321" fill="#7b8393" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle">Episodes + provenance</text><text x="1268" y="392" fill="#519cc9" font-family="monospace" font-size="12" font-weight="500" text-anchor="middle">02</text><text x="1268" y="421" fill="#3c4254" font-family="sans-serif" font-size="22" font-weight="600" text-anchor="middle">Propose</text><text x="1268" y="448" fill="#7b8393" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle">Skills + module code</text><text x="1040" y="538" fill="#519cc9" font-family="monospace" font-size="12" font-weight="500" text-anchor="middle">03</text><text x="1040" y="567" fill="#3c4254" font-family="sans-serif" font-size="22" font-weight="600" text-anchor="middle">Compare</text><text x="1040" y="594" fill="#7b8393" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle">Independent evaluation</text><text x="812" y="392" fill="#519cc9" font-family="monospace" font-size="12" font-weight="500" text-anchor="middle">04</text><text x="812" y="421" fill="#3c4254" font-family="sans-serif" font-size="22" font-weight="600" text-anchor="middle">Reuse</text><text x="812" y="448" fill="#7b8393" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle">Selected capabilities</text><path d="M438 313 Q503 323 507 360" fill="none" stroke="#519cc9" stroke-width="2.2" marker-end="url(#a)" /><path d="M507 465 Q492 505 433 518" fill="none" stroke="#519cc9" stroke-width="2.2" marker-end="url(#a)" /><path d="M285 518 Q226 505 214 465" fill="none" stroke="#519cc9" stroke-width="2.2" marker-end="url(#a)" /><path d="M214 362 Q227 321 281 313" fill="none" stroke="#519cc9" stroke-width="2.2" marker-end="url(#a)" /><path d="M1118 313 Q1183 323 1187 360" fill="none" stroke="#519cc9" stroke-width="2.2" marker-end="url(#a)" /><path d="M1187 465 Q1172 505 1113 518" fill="none" stroke="#519cc9" stroke-width="2.2" marker-end="url(#a)" /><path d="M965 518 Q906 505 894 465" fill="none" stroke="#519cc9" stroke-width="2.2" marker-end="url(#a)" /><path d="M894 362 Q907 321 961 313" fill="none" stroke="#519cc9" stroke-width="2.2" marker-end="url(#a)" /><path d="M470 571 H700 V292 H930" fill="none" stroke="#519cc9" stroke-width="2.2" marker-end="url(#a)" stroke-dasharray="5 6"/><text x="812" y="277" fill="#519cc9" font-family="monospace" font-size="12" font-weight="500" text-anchor="middle">VERIFIED EXPERIENCE</text><path d="M812 475 V637 H134 V475" fill="none" stroke="#519cc9" stroke-width="2.2" marker-end="url(#a)" stroke-dasharray="5 6"/><text x="480" y="659" fill="#519cc9" font-family="monospace" font-size="12" font-weight="500" text-anchor="middle">CAPABILITY FEEDBACK</text><path d="M60 691 L1340 691" fill="none" stroke="#d4e2ec"/><text x="60" y="726" fill="#3c4254" font-family="sans-serif" font-size="17" font-weight="600" text-anchor="start">Coupled research loops</text><text x="340" y="726" fill="#7b8393" font-family="sans-serif" font-size="17" font-weight="400" text-anchor="start">Mechanism coverage and demonstrated gains are documented in the experiment reports.</text></svg>