<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc"><title id="title">Kage — toward self-evolving computer agents</title><desc id="desc">Conceptual research cover connecting an agent to experience, skill memory, the environment and evolution. It is not a product screenshot.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#76e3d0"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#304350" stroke-opacity=".3"/></pattern></defs><rect width="1400" height="540" rx="20" fill="#0c141c"/><rect width="1400" height="540" rx="20" fill="url(#grid)"/><text x="64" y="65" font-family="monospace" font-size="16" font-weight="600" fill="#76e3d0" >KAGE / EXPERIMENTAL INTELLIGENCE SYSTEM</text><text x="60" y="232" font-family="Georgia, serif" font-size="154" font-weight="500" fill="#e8f1f4" >Kage</text><text x="66" y="292" font-family="sans-serif" font-size="27" font-weight="500" fill="#e8f1f4" >A computer agent that learns how to evolve.</text><text x="66" y="343" font-family="monospace" font-size="15" font-weight="500" fill="#99b0bc" >COMPUTER USE  /  MEMORY  /  SELF-MODIFICATION</text><text x="66" y="437" font-family="sans-serif" font-size="22" font-weight="400" fill="#76e3d0" >From execution traces to persistent capability.</text><text x="66" y="486" font-family="monospace" font-size="14" font-weight="400" fill="#99b0bc" >LOCAL EXECUTION · CLOUD TEACHING · VERIFIED ADAPTATION</text><circle cx="1102" cy="255" r="192" fill="none" stroke="#304350"/><circle cx="1102" cy="255" r="130" fill="none" stroke="#76e3d0" stroke-opacity=".35" stroke-dasharray="3 10"/><rect x="982" y="198" width="240" height="112" rx="12" fill="#0c141c" stroke="#76e3d0"/><text x="1012" y="244" font-family="sans-serif" font-size="30" font-weight="600" fill="#76e3d0" >AGENT</text><text x="1012" y="277" font-family="sans-serif" font-size="17" font-weight="400" fill="#99b0bc" >scaffold + policy</text><rect x="882" y="75" width="200" height="66" rx="12" fill="#14212c" stroke="#304350"/><text x="904" y="115" font-family="sans-serif" font-size="19" font-weight="600" fill="#e8f1f4" >EXPERIENCE</text><rect x="1130" y="75" width="206" height="66" rx="12" fill="#14212c" stroke="#304350"/><text x="1152" y="115" font-family="sans-serif" font-size="19" font-weight="600" fill="#e8f1f4" >SKILL MEMORY</text><rect x="867" y="376" width="215" height="70" rx="12" fill="#14212c" stroke="#304350"/><text x="889" y="417" font-family="sans-serif" font-size="19" font-weight="600" fill="#e8f1f4" >ENVIRONMENT</text><rect x="1130" y="376" width="206" height="70" rx="12" fill="#14212c" stroke="#304350"/><text x="1152" y="417" font-family="sans-serif" font-size="19" font-weight="600" fill="#ffc887" >EVOLUTION</text><path d="M982 141 V178 H1032 V198" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M1230 141 V176 H1170 V198" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M1032 310 V350 H970 V376" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M1170 310 V350 H1230 V376" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M1336 411 H1362 V106 H1336" fill="none" stroke="#76e3d0" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="972" y="492" font-family="monospace" font-size="14" font-weight="500" fill="#99b0bc" >ACT → VERIFY → LEARN → EVOLVE</text></svg>