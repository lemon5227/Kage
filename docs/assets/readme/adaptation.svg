<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="646" viewBox="0 0 1400 646" role="img" aria-labelledby="title desc"><title id="title">Four layers of agent adaptation</title><desc id="desc">Episodic memory, procedural memory and selected scaffold evolution are experimental mechanisms. Parameter learning and distillation are future research. The layers are a research roadmap, not a claim of demonstrated lifelong learning.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#76e3d0"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#304350" stroke-opacity=".3"/></pattern></defs><rect width="1400" height="646" rx="20" fill="#0c141c"/><rect width="1400" height="646" rx="20" fill="url(#grid)"/><text x="60" y="61" font-family="monospace" font-size="16" font-weight="600" fill="#76e3d0" >02 / ADAPTATION SPECTRUM</text><text x="60" y="107" font-family="Georgia, serif" font-size="40" font-weight="500" fill="#e8f1f4" >Experience becomes part of the system.</text><text x="60" y="142" font-family="sans-serif" font-size="19" font-weight="400" fill="#99b0bc" >A research path from contextual adaptation to structural and parametric change.</text><rect x="60" y="196" width="281" height="277" rx="12" fill="#0c141c" stroke="#304350"/><text x="82" y="246" font-family="monospace" font-size="35" font-weight="500" fill="#76e3d0" >L0</text><text x="82" y="281" font-family="monospace" font-size="13" font-weight="600" fill="#76e3d0" >EPISODIC MEMORY</text><text x="82" y="320" font-family="Georgia, serif" font-size="24" font-weight="500" fill="#e8f1f4" >Retrieve experience</text><text x="82" y="360" font-family="sans-serif" font-size="15" font-weight="400" fill="#99b0bc" >Trajectories and corrections</text><text x="82" y="388" font-family="sans-serif" font-size="15" font-weight="400" fill="#99b0bc" >Evidence-bound task history</text><text x="82" y="416" font-family="sans-serif" font-size="15" font-weight="400" fill="#99b0bc" >Relevant context at execution</text><text x="82" y="451" font-family="monospace" font-size="11" font-weight="500" fill="#76e3d0" >EXPERIMENTAL MECHANISM</text><rect x="393" y="196" width="281" height="277" rx="12" fill="#0c141c" stroke="#304350"/><text x="415" y="246" font-family="monospace" font-size="35" font-weight="500" fill="#76e3d0" >L1</text><text x="415" y="281" font-family="monospace" font-size="13" font-weight="600" fill="#76e3d0" >PROCEDURAL MEMORY</text><text x="415" y="320" font-family="Georgia, serif" font-size="24" font-weight="500" fill="#e8f1f4" >Reuse behavior</text><text x="415" y="360" font-family="sans-serif" font-size="15" font-weight="400" fill="#99b0bc" >Parameterized skills</text><text x="415" y="388" font-family="sans-serif" font-size="15" font-weight="400" fill="#99b0bc" >Semantic action workflows</text><text x="415" y="416" font-family="sans-serif" font-size="15" font-weight="400" fill="#99b0bc" >Transfer across task inputs</text><text x="415" y="451" font-family="monospace" font-size="11" font-weight="500" fill="#76e3d0" >EXPERIMENTAL MECHANISM</text><rect x="726" y="196" width="281" height="277" rx="12" fill="#0c141c" stroke="#304350"/><text x="748" y="246" font-family="monospace" font-size="35" font-weight="500" fill="#ffc887" >L2</text><text x="748" y="281" font-family="monospace" font-size="13" font-weight="600" fill="#ffc887" >SCAFFOLD EVOLUTION</text><text x="748" y="320" font-family="Georgia, serif" font-size="24" font-weight="500" fill="#e8f1f4" >Modify the agent</text><text x="748" y="360" font-family="sans-serif" font-size="15" font-weight="400" fill="#99b0bc" >Recovery / planning / retrieval</text><text x="748" y="388" font-family="sans-serif" font-size="15" font-weight="400" fill="#99b0bc" >Versioned candidate code</text><text x="748" y="416" font-family="sans-serif" font-size="15" font-weight="400" fill="#99b0bc" >Parent–child evaluations</text><text x="748" y="451" font-family="monospace" font-size="11" font-weight="500" fill="#ffc887" >EXPERIMENTAL MECHANISM</text><rect x="1059" y="196" width="281" height="277" rx="12" fill="#0c141c" stroke="#304350"/><text x="1081" y="246" font-family="monospace" font-size="35" font-weight="500" fill="#ffc887" >L3</text><text x="1081" y="281" font-family="monospace" font-size="13" font-weight="600" fill="#ffc887" >PARAMETRIC LEARNING</text><text x="1081" y="320" font-family="Georgia, serif" font-size="24" font-weight="500" fill="#e8f1f4" >Distill into weights</text><text x="1081" y="360" font-family="sans-serif" font-size="15" font-weight="400" fill="#99b0bc" >Verified teacher trajectories</text><text x="1081" y="388" font-family="sans-serif" font-size="15" font-weight="400" fill="#99b0bc" >Small-model adapter training</text><text x="1081" y="416" font-family="sans-serif" font-size="15" font-weight="400" fill="#99b0bc" >Export and held-out evaluation</text><text x="1081" y="451" font-family="monospace" font-size="11" font-weight="500" fill="#ffc887" >FUTURE RESEARCH</text><path d="M341 332 H385" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M674 332 H718" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M1007 332 H1051" fill="none" stroke="#76e3d0" stroke-width="2" marker-end="url(#arrow)"/><text x="60" y="526" font-family="monospace" font-size="14" font-weight="600" fill="#76e3d0" >RESEARCH QUESTION</text><text x="60" y="565" font-family="Georgia, serif" font-size="29" font-weight="500" fill="#e8f1f4" >Which form of adaptation produces durable, transferable capability?</text><text x="60" y="608" font-family="sans-serif" font-size="17" font-weight="400" fill="#99b0bc" >Compare completion, recovery, transfer, inference cost and regression across separately evaluated layers.</text></svg>