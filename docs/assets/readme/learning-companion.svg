<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710" role="img" aria-labelledby="title desc"><title id="title">Four depths of agent adaptation</title><desc id="desc">An editorial research map: episodic context, procedural behavior, selected agent structure, and future parametric learning. Increasing adaptation depth is conceptual, not an empirical performance curve.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#519cc9"/></marker></defs><rect width="1400" height="710" fill="#f7fafc"/><text x="60" y="54" fill="#519cc9" font-family="monospace" font-size="15" font-weight="500" text-anchor="start">02  /  ADAPTATION SPECTRUM</text><text x="60" y="117" fill="#3c4254" font-family="Georgia, serif" font-size="49" font-weight="400" text-anchor="start">A new appearance. A growing agent.</text><text x="60" y="157" fill="#7b8393" font-family="sans-serif" font-size="23" font-weight="400" text-anchor="start">From recalling a past action to rewriting the machinery of action.</text><path d="M60 194 L1340 194" fill="none" stroke="#d4e2ec"/><text x="60" y="301" fill="#3c4254" font-family="Georgia, serif" font-size="72" font-weight="500" text-anchor="start">L0</text><text x="60" y="337" fill="#519cc9" font-family="monospace" font-size="13" font-weight="600" text-anchor="start">CONTEXT</text><text x="60" y="382" fill="#3c4254" font-family="sans-serif" font-size="24" font-weight="600" text-anchor="start">Episodic memory</text><text x="60" y="417" fill="#7b8393" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="start">Retrieve experience</text><text x="60" y="451" fill="#7b8393" font-family="sans-serif" font-size="16" font-weight="400" text-anchor="start">Trajectories &amp; corrections</text><text x="60" y="476" fill="#7b8393" font-family="sans-serif" font-size="16" font-weight="400" text-anchor="start">Evidence-bound recall</text><path d="M365 237 L365 486" fill="none" stroke="#d4e2ec"/><text x="393" y="301" fill="#3c4254" font-family="Georgia, serif" font-size="72" font-weight="500" text-anchor="start">L1</text><text x="393" y="337" fill="#519cc9" font-family="monospace" font-size="13" font-weight="600" text-anchor="start">BEHAVIOR</text><text x="393" y="382" fill="#3c4254" font-family="sans-serif" font-size="24" font-weight="600" text-anchor="start">Procedural memory</text><text x="393" y="417" fill="#7b8393" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="start">Reuse learned routines</text><text x="393" y="451" fill="#7b8393" font-family="sans-serif" font-size="16" font-weight="400" text-anchor="start">Parameterized skills</text><text x="393" y="476" fill="#7b8393" font-family="sans-serif" font-size="16" font-weight="400" text-anchor="start">Transfer across task inputs</text><path d="M698 237 L698 486" fill="none" stroke="#d4e2ec"/><text x="726" y="301" fill="#3c4254" font-family="Georgia, serif" font-size="72" font-weight="500" text-anchor="start">L2</text><text x="726" y="337" fill="#519cc9" font-family="monospace" font-size="13" font-weight="600" text-anchor="start">STRUCTURE</text><text x="726" y="382" fill="#3c4254" font-family="sans-serif" font-size="24" font-weight="600" text-anchor="start">Scaffold evolution</text><text x="726" y="417" fill="#7b8393" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="start">Modify selected modules</text><text x="726" y="451" fill="#7b8393" font-family="sans-serif" font-size="16" font-weight="400" text-anchor="start">Recovery / planning / retrieval</text><text x="726" y="476" fill="#7b8393" font-family="sans-serif" font-size="16" font-weight="400" text-anchor="start">Candidate code &amp; comparisons</text><path d="M1031 237 L1031 486" fill="none" stroke="#d4e2ec"/><text x="1059" y="301" fill="#3c4254" font-family="Georgia, serif" font-size="72" font-weight="500" text-anchor="start">L3</text><text x="1059" y="337" fill="#519cc9" font-family="monospace" font-size="13" font-weight="600" text-anchor="start">PARAMETERS</text><text x="1059" y="382" fill="#3c4254" font-family="sans-serif" font-size="24" font-weight="600" text-anchor="start">Parametric learning</text><text x="1059" y="417" fill="#7b8393" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="start">Distill verified experience</text><text x="1059" y="451" fill="#7b8393" font-family="sans-serif" font-size="16" font-weight="400" text-anchor="start">Small-model adapter research</text><text x="1059" y="476" fill="#7b8393" font-family="sans-serif" font-size="16" font-weight="400" text-anchor="start">Future training &amp; export</text><path d="M60 534 H1339" fill="none" stroke="#519cc9" stroke-width="2.2" marker-end="url(#a)" /><text x="60" y="571" fill="#519cc9" font-family="monospace" font-size="13" font-weight="500" text-anchor="start">INCREASING DEPTH OF ADAPTATION</text><text x="60" y="634" fill="#3c4254" font-family="Georgia, serif" font-size="37" font-weight="400" text-anchor="start">Can experience produce durable capability?</text><text x="60" y="672" fill="#7b8393" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="start">Evaluate transfer, recovery, cost and regression at each layer. Weight adaptation is future research.</text></svg>